#:schema https://yazi-rs.github.io/schemas/keymap.json

### Custom ###

[[mgr.prepend_keymap]]
on = "!"
run = "shell --block -- $SHELL -l"
desc = "Open shell here"

[[mgr.prepend_keymap]]
on = "i"
run = "shell --block -- bat --paging=always --pager=less --style=numbers,grid %h"
desc = "Show text on pager"

[[mgr.prepend_keymap]]
on = ["e", "v"]
run = 'shell --block -- "$EDITOR"'
desc = "Open editor in CWD"

[[mgr.prepend_keymap]]
on = ["e", "d"]
run = "shell --block -- git diff --no-index %s1 %s2 || true"
desc = "Diff first 2 selected files"

[[mgr.prepend_keymap]]
on = ["e", "r"]
run = "shell -- chezmoi re-add"
desc = "Re-add all files to chezmoi"

### Plugins ###

[[mgr.prepend_keymap]]
on = ["c", "m"]
run = "plugin chmod"
desc = "Chmod on selected files"

[[mgr.prepend_keymap]]
on = "<Tab>"
run = "plugin toggle-pane max-preview"
desc = "Maximize or restore the preview pane"

[[mgr.prepend_keymap]]
on = "F"
run = "plugin smart-filter"
desc = "Smart filter"

[[mgr.prepend_keymap]]
on = "C"
run = "plugin ouch zip"
desc = "Compress with ouch"

[[mgr.prepend_keymap]]
on = "M"
run = "plugin mount"
desc = "Mount with fuse"

[[mgr.prepend_keymap]]
on = ["e", "g"]
run = "plugin lazygit"
desc = "Run lazygit"

### Bookmarks ###

[[mgr.prepend_keymap]]
on = ["g", "H"]
run = "cd ~/.local/share/chezmoi"
desc = "Go to chezmoi source directory"

[[mgr.prepend_keymap]]
on = ["g", "p"]
run = "cd ~/Documents/projects"
desc = "Go to projects directory"

[[mgr.prepend_keymap]]
on = ["g", "t"]
run = "cd /tmp"
desc = "Go to temp directory"
for = "linux"

[[mgr.prepend_keymap]]
on = ["g", "s"]
run = "cd ~/.local/share"
desc = "Go to data share directory"

[[mgr.prepend_keymap]]
on = ["g", "r"]
run = "cd /"
desc = "Go to root"
for = "linux"
